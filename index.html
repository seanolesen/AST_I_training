<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Avalanche Safety Training Prep</title>
    <meta name="theme-color" content="#0f1720" />
    <meta name="description" content="Practice tools for Avalanche Skills Training. Works offline." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AST Prep" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <style>
      html, body { margin: 0; height: 100%; background: #0f1720; }
      #root { min-height: 100%; box-sizing: border-box; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="splash" aria-hidden="true" style="position:fixed;inset:0;z-index:5000;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(#17222f,#0d131b);transition:opacity .35s ease;">
      <svg width="116" height="116" viewBox="0 0 1024 1024" aria-hidden="true">
        <defs>
          <linearGradient id="spO" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7ad57"/><stop offset="1" stop-color="#df6f28"/></linearGradient>
        <g id="spFlake" fill="none" stroke="#7cc4ff" stroke-width="22" stroke-linecap="round">
        <g><line x1="0" y1="0" x2="0" y2="-120"/><line x1="0" y1="-82" x2="-28" y2="-108"/><line x1="0" y1="-82" x2="28" y2="-108"/></g>
        <g transform="rotate(60)"><line x1="0" y1="0" x2="0" y2="-120"/><line x1="0" y1="-82" x2="-28" y2="-108"/><line x1="0" y1="-82" x2="28" y2="-108"/></g>
        <g transform="rotate(120)"><line x1="0" y1="0" x2="0" y2="-120"/><line x1="0" y1="-82" x2="-28" y2="-108"/><line x1="0" y1="-82" x2="28" y2="-108"/></g>
        <g transform="rotate(180)"><line x1="0" y1="0" x2="0" y2="-120"/><line x1="0" y1="-82" x2="-28" y2="-108"/><line x1="0" y1="-82" x2="28" y2="-108"/></g>
        <g transform="rotate(240)"><line x1="0" y1="0" x2="0" y2="-120"/><line x1="0" y1="-82" x2="-28" y2="-108"/><line x1="0" y1="-82" x2="28" y2="-108"/></g>
        <g transform="rotate(300)"><line x1="0" y1="0" x2="0" y2="-120"/><line x1="0" y1="-82" x2="-28" y2="-108"/><line x1="0" y1="-82" x2="28" y2="-108"/></g>
        </g>
        <g id="spOc" fill="none" stroke="#ffd89a" stroke-width="26" stroke-linecap="round">
        <g><line x1="0" y1="0" x2="0" y2="-120"/><line x1="0" y1="-82" x2="-28" y2="-108"/><line x1="0" y1="-82" x2="28" y2="-108"/></g>
        <g transform="rotate(60)"><line x1="0" y1="0" x2="0" y2="-120"/><line x1="0" y1="-82" x2="-28" y2="-108"/><line x1="0" y1="-82" x2="28" y2="-108"/></g>
        <g transform="rotate(120)"><line x1="0" y1="0" x2="0" y2="-120"/><line x1="0" y1="-82" x2="-28" y2="-108"/><line x1="0" y1="-82" x2="28" y2="-108"/></g>
        <g transform="rotate(180)"><line x1="0" y1="0" x2="0" y2="-120"/><line x1="0" y1="-82" x2="-28" y2="-108"/><line x1="0" y1="-82" x2="28" y2="-108"/></g>
        <g transform="rotate(240)"><line x1="0" y1="0" x2="0" y2="-120"/><line x1="0" y1="-82" x2="-28" y2="-108"/><line x1="0" y1="-82" x2="28" y2="-108"/></g>
        <g transform="rotate(300)"><line x1="0" y1="0" x2="0" y2="-120"/><line x1="0" y1="-82" x2="-28" y2="-108"/><line x1="0" y1="-82" x2="28" y2="-108"/></g>
        </g>
        </defs>
        <polygon points="512,436 766,800 258,800" fill="#25374a"/>
        <polygon points="336,688 688,688 766,800 258,800" fill="url(#spO)"/>
        <polygon points="512,436 603,566 421,566" fill="#e8eef4"/>
        <line x1="421" y1="566" x2="603" y2="566" stroke="#bcd0e2" stroke-width="5" opacity=".7"/>
        <use href="#spOc" transform="translate(430,742) scale(.15) rotate(9)"/>
        <use href="#spOc" transform="translate(566,736) scale(.13) rotate(-13)"/>
        <use href="#spOc" transform="translate(494,776) scale(.11) rotate(4)"/>
        <path d="M258 800 L512 436 L766 800" fill="none" stroke="#7cc4ff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
        <use href="#spFlake" transform="translate(512,300) scale(.78)"/>
      </svg>
      <div style="margin-top:14px;font:800 20px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#e8eef4;letter-spacing:-.4px;">AST Prep</div>
      <div style="margin-top:18px;width:26px;height:26px;border:3px solid rgba(255,255,255,.18);border-top-color:#7cc4ff;border-radius:50%;animation:astspin .8s linear infinite;"></div>
      <style>@keyframes astspin{to{transform:rotate(360deg)}}</style>
    </div>
    <script>
      (function () {
        var root = document.getElementById('root'), splash = document.getElementById('splash');
        if (!root || !splash) return;
        var hide = function () { splash.style.opacity = '0'; setTimeout(function () { if (splash && splash.parentNode) splash.parentNode.removeChild(splash); }, 400); };
        if (root.childElementCount > 0) { hide(); return; }
        var obs = new MutationObserver(function () { if (root.childElementCount > 0) { obs.disconnect(); hide(); } });
        obs.observe(root, { childList: true });
        setTimeout(function () { try { obs.disconnect(); } catch (e) {} }, 12000);
      })();
    </script>

    <script>
      /* Self-heal: if the app hasn't rendered after 8s, a stale or broken service-worker
         cache is the likely cause. Clear it and reload once (guarded so it never loops). */
      (function () {
        setTimeout(function () {
          var root = document.getElementById('root');
          if (!root || root.childElementCount > 0) return;
          try { if (sessionStorage.getItem('astp_healed')) return; sessionStorage.setItem('astp_healed', '1'); } catch (e) {}
          var reload = function () { location.reload(); };
          var jobs = [];
          try {
            if ('serviceWorker' in navigator) {
              jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
                return Promise.all(rs.map(function (r) { return r.unregister(); }));
              }));
            }
            if (window.caches && caches.keys) {
              jobs.push(caches.keys().then(function (ks) {
                return Promise.all(ks.map(function (k) { return caches.delete(k); }));
              }));
            }
            Promise.all(jobs).then(reload, reload);
          } catch (e) { reload(); }
        }, 8000);
      })();
    </script>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
