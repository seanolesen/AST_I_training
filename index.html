<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Avalanche Safety Training Prep</title>
    <meta name="theme-color" content="#0f1720" />
    <meta name="description" content="Practice tools for Avalanche Skills Training. Works offline." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AST Prep" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <style>
      html, body { margin: 0; height: 100%; background: #0f1720; }
      #root { min-height: 100%; box-sizing: border-box; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      /* Self-heal: if the app hasn't rendered after 8s, a stale or broken service-worker
         cache is the likely cause. Clear it and reload once (guarded so it never loops). */
      (function () {
        setTimeout(function () {
          var root = document.getElementById('root');
          if (!root || root.childElementCount > 0) return;
          try { if (sessionStorage.getItem('astp_healed')) return; sessionStorage.setItem('astp_healed', '1'); } catch (e) {}
          var reload = function () { location.reload(); };
          var jobs = [];
          try {
            if ('serviceWorker' in navigator) {
              jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
                return Promise.all(rs.map(function (r) { return r.unregister(); }));
              }));
            }
            if (window.caches && caches.keys) {
              jobs.push(caches.keys().then(function (ks) {
                return Promise.all(ks.map(function (k) { return caches.delete(k); }));
              }));
            }
            Promise.all(jobs).then(reload, reload);
          } catch (e) { reload(); }
        }, 8000);
      })();
    </script>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
